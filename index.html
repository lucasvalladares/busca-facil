<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca Fácil · Desconto de verdade ou maquiagem?</title>
<style>
/* ============================================================
   CORES E MEDIDAS — ajuste aqui
   ============================================================ */
:root {
  --azul:     #0047F7;   /* fundo principal */
  --branco:   #FFFFFF;   /* textos grandes, menu e botões */
  --laranja:  #FA4802;   /* selos e destaques */

  /* apoio */
  --azul-2:      #0039C6;  /* seção dos cartões (um tom abaixo do azul, para separar) */
  --tinta:       #0B1533;  /* texto escuro dentro dos cartões brancos */
  --tinta-suave: #4A5578;
  --linha-card:  #E3E7F2;
  --azul-claro:  #EDF2FF;  /* faixa "normal" do gráfico */
  --texto-no-laranja: #0B1533;

  --fonte-titulo: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --raio-card: 22px;
  --borda-detalhe: 3px solid #000000;  /* bordas dos cartões da página do aparelho */
}
@font-face { font-family: "Anton"; src: url("fontes/anton-latin.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Inter"; src: url("fontes/inter-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--azul); color: var(--branco); font: 400 15px/1.5 var(--fonte); overflow-x: hidden; }
a { color: inherit; }
button, select, input { font: inherit; }
.miolo { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; }
:focus-visible { outline: 3px solid var(--branco); outline-offset: 3px; }
.card :focus-visible { outline-color: var(--azul); }

/* ---------- Menu em pílula ---------- */
.menu { display: flex; align-items: center; gap: 8px; border: 2px solid var(--branco); border-radius: 999px;
  padding: 6px 20px; min-height: 56px; margin: 20px 0 0; position: relative; z-index: 3; }
.marca { font-family: var(--fonte-titulo); font-size: 22px; letter-spacing: .02em; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-right: auto; }
.marca svg { width: 16px; height: 16px; fill: var(--branco); }
.menu .link { text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; }
.menu .link:hover { background: var(--branco); color: var(--azul); }
.espaco-voltar { height: 28px; }
.menu .data { font-size: 12px; opacity: .85; padding: 0 10px; white-space: nowrap; }
.moeda { display: inline-flex; border: 2px solid var(--branco); border-radius: 999px; padding: 2px; flex: none; }
.moeda button { background: none; border: 0; color: var(--branco); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
.moeda button[aria-pressed="true"] { background: var(--branco); color: var(--azul); }
.aviso-teste { font-weight: 600; }
.cotacao { margin: -10px 0 24px; font-size: 13px; opacity: .9; }

/* ---------- Botões em pílula com seta ---------- */
.botao { display: inline-flex; align-items: center; gap: 10px; background: var(--branco); color: var(--azul);
  border: 2px solid var(--branco); border-radius: 999px; padding: 12px 22px; font-weight: 700; text-decoration: none;
  text-transform: uppercase; letter-spacing: .03em; font-size: 14px; cursor: pointer; transition: transform .15s; }
.botao:hover { transform: translateX(3px); }
.botao .seta { font-size: 18px; line-height: 1; }
.botao-contorno { background: transparent; color: var(--branco); }
.botao-azul { background: var(--azul); border-color: var(--azul); color: var(--branco); padding: 10px 18px; font-size: 13px; }

/* ---------- Topo / títulos ---------- */
.hero { position: relative; padding: 56px 0 96px; }
.titulo-gigante { font-family: var(--fonte-titulo); font-weight: 400; text-transform: uppercase; line-height: .92;
  font-size: clamp(52px, 9vw, 128px); letter-spacing: .005em; margin: 0; max-width: 12ch; position: relative; }
.titulo-gigante.menor { font-size: clamp(48px, 8vw, 112px); max-width: none; }
.hero p.chamada { font-size: 19px; max-width: 34em; margin: 24px 0 32px; }
.hero .linha-sub { font-family: var(--fonte-titulo); font-size: clamp(22px, 3vw, 34px); text-transform: uppercase; margin: 10px 0 28px; letter-spacing: .02em; }
.h-secao { font-family: var(--fonte-titulo); font-weight: 400; text-transform: uppercase; font-size: clamp(36px, 5vw, 64px); line-height: 1; margin: 0 0 24px; }

.hero-grade { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.destaque-dia { position: relative; justify-self: center; width: min(340px, 100%); transform: rotate(3deg); text-decoration: none; }
.destaque-dia .card { padding: 26px 26px 22px; box-shadow: 10px 10px 0 rgba(11, 21, 51, .25); }
.destaque-dia .selo { top: -50px; right: -38px; }
.destaque-dia img { display: block; width: 150px; height: 150px; object-fit: contain; margin: 4px auto 14px; }
.destaque-dia .rot { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--tinta-suave); }
.destaque-dia .nome { font-family: var(--fonte-titulo); font-size: 28px; text-transform: uppercase; line-height: 1; color: var(--tinta); margin-top: 4px; }
.destaque-dia .botao-azul { margin-top: 16px; }

/* Estrelinhas decorativas */
.estrelas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.hero > .miolo, .rodape-site > .miolo { position: relative; z-index: 2; }
.estrelas svg { position: absolute; fill: var(--branco); animation: brilho 3.2s ease-in-out infinite; }
@keyframes brilho { 0%, 100% { opacity: .95; transform: scale(1) rotate(0deg); } 50% { opacity: .45; transform: scale(.8) rotate(12deg); } }

/* Onda separando as seções */
.onda { display: block; position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 44px; z-index: 1; }

/* ---------- Selos (adesivos) ---------- */
.selo { position: absolute; width: 118px; height: 118px; display: grid; place-items: center; z-index: 4;
  transform: rotate(var(--giro, -9deg)); filter: drop-shadow(0 3px 0 rgba(11, 21, 51, .25)); pointer-events: none; }
.selo svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--laranja); }
.selo span { position: relative; font-family: var(--fonte-titulo); color: var(--texto-no-laranja); text-transform: uppercase;
  font-size: 19px; line-height: 1; text-align: center; letter-spacing: .02em; }
.selo.pequeno { width: 92px; height: 92px; }
.selo.pequeno span { font-size: 15px; }

/* ---------- Filtros em pílula ---------- */
.filtros { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin: 0 0 32px; }
.grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
.grupo > .rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; font-weight: 600; }
.opcoes { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.opcoes button { border: 2px solid var(--branco); background: transparent; color: var(--branco); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
@media (hover: hover) { .opcoes button:hover:not(:disabled):not([aria-pressed="true"]) { background: rgba(255,255,255,.14); } }
.opcoes button[aria-pressed="true"] { background: var(--branco); color: var(--azul); }
.opcoes button:disabled { opacity: .4; cursor: default; }
.opcoes .n { opacity: .75; margin-left: 4px; }
.opcoes button.op-barato::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); margin-right: 6px; }
.etiqueta.atalho { cursor: pointer; }
.etiqueta.atalho:hover { text-decoration: underline; }
select, input[type=search] { border: 2px solid var(--branco); background: transparent; color: var(--branco);
  border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13px; }
select option { color: var(--tinta); }
input[type=search]::placeholder { color: rgba(255,255,255,.75); }
input[type=search] { min-width: 220px; }

/* ---------- Seção dos cartões ---------- */
.secao-cartoes { background: var(--azul-2); padding: 56px 0 104px; position: relative; }
.catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 28px; }
.card { background: var(--branco); color: var(--tinta); border-radius: var(--raio-card); padding: 24px; position: relative; }
.produto { display: flex; flex-direction: column; text-decoration: none; transition: transform .15s; }
.produto:hover { transform: translateY(-3px); }
.produto .selo { top: -30px; right: -14px; }
.produto .topo { display: flex; gap: 16px; align-items: center; }
.produto .foto { width: 76px; height: 76px; flex: none; display: flex; align-items: center; justify-content: center; }
.produto .foto img { max-width: 100%; max-height: 100%; object-fit: contain; }
.produto h3 { font-family: var(--fonte-titulo); font-weight: 400; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 0; padding-right: 64px; }
.produto .arm { color: var(--tinta-suave); font-size: 12px; margin-top: 6px; }
.apartir { color: var(--tinta-suave); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-top: 18px; }
.preco-grande { font-family: var(--fonte-titulo); font-size: 42px; line-height: 1; color: var(--tinta); margin-top: 4px; letter-spacing: .01em; }
.produto .loja { color: var(--tinta-suave); font-size: 13px; margin-top: 6px; }
.produto .loja b { color: var(--tinta); }
.produto .botao-azul { margin-top: auto; align-self: flex-start; }
.produto .loja { margin-bottom: 20px; }
.vazio { padding: 40px 0; font-size: 18px; }
.etiquetas { margin-top: 10px; }
.etiqueta { display: inline-flex; align-items: center; gap: 2px; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.etiqueta-barato { background: var(--laranja); color: var(--texto-no-laranja); }
.etiqueta-normal { background: var(--azul-claro); color: var(--azul); }
.etiqueta-caro { background: var(--tinta); color: var(--branco); }
.etiquetas { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.etiqueta-pct { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .85; }
.mini-termo { position: relative; display: inline-flex; gap: 2px; width: 64px; height: 6px; flex: none; }
.mini-termo i { flex: 1; border-radius: 3px; background: var(--linha-card); }
.mini-termo i:nth-child(2) { background: var(--azul-claro); box-shadow: inset 0 0 0 1px var(--linha-card); }
.cartao-barato .mini-termo i:first-child { background: var(--laranja); }
.cartao-caro .mini-termo i:last-child { background: var(--tinta); }
.mini-termo b { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--tinta); box-shadow: 0 0 0 2px var(--branco); }
/* barato: o cartão inteiro em destaque */
.produto.cartao-barato { box-shadow: 0 0 0 5px var(--laranja), 0 10px 0 5px rgba(11, 21, 51, .18); }
.produto.cartao-barato .etiqueta-barato { font-size: 13px; padding: 6px 14px; }
/* caro: faixa escura no topo do cartão */
.produto.cartao-caro { border-top: 8px solid var(--tinta); }
.etiqueta-coletando { background: #F1F3F8; color: var(--tinta-suave); font-weight: 600; }

/* ---------- Página inicial: categorias ---------- */
.categorias { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 28px; }
.categoria-card { display: flex; flex-direction: column; text-decoration: none; transition: transform .15s; padding: 28px; }
.categoria-card:hover { transform: translateY(-3px); }
.categoria-card .fotos { display: flex; gap: 14px; height: 120px; align-items: flex-end; margin-bottom: 14px; }
.categoria-card .fotos img { height: 100%; width: auto; max-width: 32%; object-fit: contain; }
.categoria-card h3 { font-family: var(--fonte-titulo); font-weight: 400; text-transform: uppercase; font-size: 64px; line-height: .95; margin: 0; }
.categoria-card .linhas { color: var(--tinta-suave); font-weight: 700; margin-top: 6px; }
.categoria-card .stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: var(--tinta-suave); }
.categoria-card .botao-azul { align-self: flex-start; margin-top: 18px; }

/* ---------- Detalhe ---------- */
.pagina-detalhe .card { border: var(--borda-detalhe); }
.det-grade { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 28px; margin-bottom: 28px; }
.det-grade-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 28px; }
.card h2 { font-family: var(--fonte-titulo); font-weight: 400; text-transform: uppercase; font-size: 32px; line-height: 1; margin: 0 0 18px; color: var(--tinta); }
.foto-card { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 360px; }
.foto-card img { width: 100%; max-width: 340px; max-height: 360px; object-fit: contain; }
.legenda-foto { color: var(--tinta-suave); font-size: 12px; margin-top: 8px; text-align: center; }
.lojas-card .selo { top: -36px; right: 20px; }
.lojas-card h2 { padding-right: 110px; }
.lista-lojas { list-style: none; margin: 0; padding: 0; }
.lista-lojas li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 14px 0; border-top: 1px solid var(--linha-card); }
.lista-lojas li:first-child { border-top: 0; padding-top: 0; }
.lista-lojas .nome-loja { font-weight: 700; }
.lista-lojas .valor { font-family: var(--fonte-titulo); text-align: right; font-size: 26px; line-height: 1.05; }
.lista-lojas li.primeiro { background: var(--azul-claro); border-radius: 14px; padding: 14px; margin: 0 -14px 6px; border-top: 0; }
.lista-lojas li.primeiro .valor { font-size: 40px; color: var(--azul); }
.lista-lojas .detalhe { color: var(--tinta-suave); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista-lojas .detalhe a { color: var(--azul); font-weight: 600; text-decoration: none; }
.lista-lojas .detalhe a:hover { text-decoration: underline; }
.lista-lojas .dif { text-align: right; color: var(--tinta-suave); font-size: 12px; }
.lista-lojas .obs { grid-column: 1 / -1; color: var(--tinta-suave); font-size: 12px; }
.lista-lojas .obs b { color: var(--tinta); }
.lista-lojas li.fora { opacity: .55; }
.alerta { background: var(--laranja); color: var(--texto-no-laranja); border-radius: 14px; padding: 12px 16px; margin: 0 0 18px; font-size: 14px; }
.alerta b { font-family: var(--fonte-titulo); font-weight: 400; font-size: 20px; text-transform: uppercase; display: block; letter-spacing: .02em; }

.indicador .selo { top: -40px; right: -10px; }
.indicador h2 { padding-right: 96px; }
.veredito { font-family: var(--fonte-titulo); text-transform: uppercase; font-size: 64px; line-height: .95; color: var(--azul); }
.var-texto { color: var(--tinta-suave); margin: 8px 0 22px; }
.var-texto b { color: var(--tinta); }
.regua { position: relative; height: 10px; display: flex; gap: 3px; margin: 30px 0 8px; }
.regua span { flex: 1; border-radius: 999px; background: var(--linha-card); }
.regua span.z-normal { background: var(--azul-claro); box-shadow: inset 0 0 0 2px var(--linha-card); }
.regua .marcador { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--azul); box-shadow: 0 0 0 4px var(--branco); }
.regua .marcador-rot { position: absolute; bottom: 18px; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--azul); text-transform: uppercase; }
.regua-rot { display: flex; color: var(--tinta-suave); font-size: 12px; }
.regua-rot span { flex: 1; text-align: center; }
.numeros { margin: 22px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
.numeros dt { color: var(--tinta-suave); }
.numeros dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.nota { color: var(--tinta-suave); font-size: 12px; margin-top: 14px; }

/* ---------- Gráfico ---------- */
.grafico { position: relative; }
.grafico svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.grafico text { font-size: 11px; fill: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.grafico .rot-fim { fill: var(--azul); font-weight: 700; font-size: 12px; }
.linha-preco { stroke: var(--azul); }
.ponto-fim { fill: var(--azul); stroke: var(--branco); }
.grafico .cruz { stroke: var(--azul); stroke-opacity: .3; stroke-width: 1; visibility: hidden; }
.marcador-dia { visibility: hidden; pointer-events: none; }
.marcador-dia circle { fill: var(--azul); stroke: var(--branco); }
.grafico svg.ativo .cruz, .grafico svg.ativo .marcador-dia { visibility: visible; }
.grafico .cruz, .marcador-dia { transition: transform 110ms cubic-bezier(.3, 1.9, .55, 1); }
.marcador-dia circle.tic { animation: tic 160ms ease-out; }
@keyframes tic { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
.grafico svg.sem-transicao .cruz, .grafico svg.sem-transicao .marcador-dia, .grafico svg.sem-transicao ~ .dica { transition: none; }
.dica { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--tinta); color: var(--branco);
  border-radius: 12px; padding: 8px 12px; font-size: 12px; white-space: nowrap; display: none; z-index: 2;
  transition: transform 110ms cubic-bezier(.3, 1.6, .55, 1); }
.dica .p { font-family: var(--fonte-titulo); font-size: 22px; line-height: 1.1; letter-spacing: .02em; }
.dica .d, .dica .l { opacity: .8; }
.legenda { display: flex; gap: 16px; flex-wrap: wrap; color: var(--tinta-suave); font-size: 12px; margin-top: 12px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.chave-linha { width: 16px; border-top: 2px solid var(--azul); opacity: .35; }
.chave-faixa { width: 16px; height: 10px; border-radius: 3px; background: var(--azul-claro); box-shadow: inset 0 0 0 1px var(--linha-card); }
.nota-sim { color: var(--tinta-suave); font-size: 12px; margin: -8px 0 14px; }
details { margin-top: 14px; font-size: 13px; }
summary { cursor: pointer; color: var(--azul); font-weight: 600; }
table { border-collapse: collapse; margin-top: 8px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--linha-card); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--tinta-suave); }

/* ---------- Barra fixa do menor preço (só no celular) ---------- */
.barra-preco { display: none; }
@media (max-width: 760px) {
  .barra-preco { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
    align-items: center; justify-content: space-between; gap: 12px; background: var(--branco); color: var(--tinta);
    border: var(--borda-detalhe); border-radius: 18px; padding: 10px 10px 10px 16px; text-decoration: none;
    box-shadow: 0 6px 0 rgba(11, 21, 51, .25); transition: transform .25s, opacity .25s; }
  .barra-preco.oculta { transform: translateY(150%); opacity: 0; pointer-events: none; }
  .bp-texto { min-width: 0; }
  .bp-rot { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-suave);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bp-preco { font-family: var(--fonte-titulo); font-size: 26px; line-height: 1.05; color: var(--azul); }
  .bp-loja { font-size: 12px; font-weight: 600; }
  .barra-preco .botao-azul { flex: none; }
  .barra-preco.passou .botao-azul { display: none; }
  .barra-preco.passou { cursor: default; }
}

/* ---------- Rodapé ---------- */
.rodape-site { padding: 56px 0 72px; position: relative; }
.passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-bottom: 36px; }
.passo { border: 2px solid var(--branco); border-radius: var(--raio-card); padding: 22px; }
.passo b { font-family: var(--fonte-titulo); font-weight: 400; font-size: 26px; text-transform: uppercase; display: block; margin-bottom: 6px; letter-spacing: .02em; }
.status { font-size: 13px; opacity: .92; }
.status ul { padding-left: 18px; margin: 8px 0; }

@media (prefers-reduced-motion: reduce) {
  .estrelas svg, .marcador-dia circle.tic { animation: none; }
  .grafico .cruz, .marcador-dia, .dica, .botao, .produto { transition: none; }
}
/* ---------- Celular ---------- */
@media (max-width: 760px) {
  .miolo { padding: 0 16px; }
  .menu { padding: 6px 16px; }
  .menu .link, .menu .data { display: none; }
  .hero { padding: 20px 0 68px; }
  .espaco-voltar { height: 14px; }
  .secao-cartoes { padding: 24px 0 88px; }
  .filtros-carrossel { gap: 10px; margin-bottom: 8px; }
  .filtros-carrossel .grupo { display: block; }

function menorPorDia(v) {
  const dia = {};
  for (const loja in v.series) for (const [d, p] of v.series[loja])
    if (d >= DADOS.inicioJanela && (!dia[d] || p < dia[d].preco)) dia[d] = {data: d, preco: p, loja};

// Termômetro de preço (Barato / Normal / Caro): compara o menor preço de hoje com a média
// dos ÚLTIMOS 40 DIAS. O gráfico continua mostrando até 12 meses (e a linha de média de 12 meses).
const JANELA_TERMOMETRO = 40;
function analisar(v) {
  const todos = menorPorDia(v).filter(p => p.data <= DADOS.ultimaData);
  const media = l => l.reduce((s, p) => s + p.preco, 0) / l.length;
  const limite = iso(t(DADOS.ultimaData) - (JANELA_TERMOMETRO - 1) * DIA);
  const pts = todos.filter(p => p.data >= limite);
  const m40 = media(pts), atual = v.hoje[0].preco;
  const variacao = (atual - m40) / m40;
  const classe = variacao < -0.10 ? 'barato' : variacao > 0.10 ? 'caro' : 'normal';
  return {atual, media: m40, media12: media(todos), variacao, classe, dias: pts.length,

}

function blackFriday(ano) { const d = new Date(ano, 10, 1, 12); return new Date(ano, 10, 1 + (5 - d.getDay() + 7) % 7 + 21, 12); }
// Nos 30 dias antes da Black Friday: hoje >5% acima da média do mês anterior a essa janela.
function alertaBlackFriday(v) {
  const hoje = t(DADOS.ultimaData);
  const bf = blackFriday(new Date(hoje).getFullYear()).getTime();
  if (hoje > bf || hoje < bf - 30 * DIA) return null;
  const ref = menorPorDia(v).filter(p => t(p.data) >= bf - 60 * DIA && t(p.data) < bf - 30 * DIA);
  if (ref.length < 7) return null;
  const media = ref.reduce((s, p) => s + p.preco, 0) / ref.length;
  const subida = (v.hoje[0].preco - media) / media;
  if (subida <= 0.05) return null;
  return {subida, media, de: ref[0].data, ate: ref[ref.length - 1].data, bf: iso(bf)};
}

  if (DADOS.simulado) el('p', {class: 'cotacao aviso-teste'}, ms, 'Dados de teste: ' + dataLonga(DADOS.simulado.de) + ' a ' +
    dataLonga(DADOS.simulado.ate) + ' são inventados.');
  const grade = el('div', {class: 'categorias'}, ms);
  DADOS.categorias.forEach(cat => {
    const doCat = DADOS.modelos.filter(m => m.categoria === cat.id && ofertasHoje(m, 'Novo').length);
    if (!doCat.length) return;
    const a = el('a', {class: 'card categoria-card', href: '#/c/' + cat.id}, grade);
    const fotos = el('div', {class: 'fotos'}, a);
    // até 3 fotos de modelos diferentes: uma de cada linha primeiro (ex.: iPhone e Xiaomi), depois as demais
    const usadas = new Set();
    const pôr = m => { if (m && m.foto && !usadas.has(m.foto) && usadas.size < 3) { usadas.add(m.foto); el('img', {src: m.foto, alt: '', loading: 'lazy'}, fotos); } };
    cat.linhas.forEach(l => pôr(doCat.find(x => x.linha === l && x.foto)));
    doCat.forEach(pôr);
    el('h3', null, a, rot(cat.nome));
    el('div', {class: 'linhas'}, a, cat.linhas.filter(l => doCat.some(m => m.linha === l)).map(rot).join(' · '));
    const baratos = doCat.filter(m => { const an = analisar(maisBarata(m, 'Novo')); return an.dias >= MIN_DIAS_ETIQUETA && an.classe === 'barato'; }).length;
    const st = el('div', {class: 'stats'}, a);
    st.append(doCat.length + ' modelos');
    if (baratos) {
      const b = el('span', {class: 'etiqueta etiqueta-barato atalho'}, st);
      el('span', {'aria-hidden': 'true'}, b, '↓ '); b.append(baratos + ' abaixo do normal hoje');
      b.addEventListener('click', ev => { ev.preventDefault(); location.hash = '#/c/' + cat.id + '?preco=barato'; });
    }
    el('div', {class: 'apartir'}, a, 'A partir de');
    el('div', {class: 'preco-grande'}, a, preco(Math.min(...doCat.map(m => maisBarata(m, 'Novo').hoje[0].preco))));
    const b = el('span', {class: 'botao botao-azul'}, a, 'Ver ' + rot(cat.nome).toLowerCase() + ' ');
    el('span', {class: 'seta', 'aria-hidden': 'true'}, b, '→');
  });
  onda(sec, 'var(--azul)');
}

function paginaCategoria(catId, precoPedido) {
  const cat = DADOS.categorias.find(c => c.id === catId) || DADOS.categorias[0];
  if (filtro.categoria !== cat.id) Object.assign(filtro, {categoria: cat.id, marca: '', preco: '', linha: '', busca: ''});
  if (precoPedido) filtro.preco = precoPedido;
  document.title = rot(cat.nome) + ' · Busca Fácil';
  const hero = el('section', {class: 'hero'}, app);
  estrelas(hero, [[84, 12, 28, 0], [70, 52, 16, .8], [94, 70, 20, 1.5], [55, 14, 12, 2.1]]);
  const mi = el('div', {class: 'miolo'}, hero);
  botao(mi, '← Todas as categorias', 'botao-contorno', null, '#/').querySelector('.seta').remove();
  el('div', {class: 'espaco-voltar'}, mi);
  el('h1', {class: 'titulo-gigante menor'}, mi, rot(cat.nome));
  el('p', {class: 'chamada'}, mi, 'O menor preço de hoje em cada modelo, entre ' + DADOS.status.length + ' lojas do Paraguai.');
  linhaCotacao(mi, 'cotacao');
  if (DADOS.simulado) el('p', {class: 'cotacao aviso-teste'}, mi, 'Dados de teste: ' + dataLonga(DADOS.simulado.de) + ' a ' +
    dataLonga(DADOS.simulado.ate) + ' são inventados.');
  onda(hero, 'var(--azul-2)');

  const sec = el('section', {class: 'secao-cartoes', id: 'modelos'}, app);
  const ms = el('div', {class: 'miolo'}, sec);
  const doCat = DADOS.modelos.filter(m => m.categoria === cat.id);
  const barra = el('div', {class: 'filtros filtros-carrossel'}, ms);
  const g0 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g0, 'Marca');
  const segM = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Marca'}, g0);
  const g1 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g1, 'Condição');
  const seg = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Condição'}, g1);
  const gP = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, gP, 'Preço');
  const segP = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Preço'}, gP);
  const g2 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g2, 'Série');
  const sel = el('select', {'aria-label': 'Série'}, g2);
  const g3 = el('div', {class: 'grupo'}, barra);
  const busca = el('input', {type: 'search', placeholder: 'Buscar modelo', 'aria-label': 'Buscar modelo'}, g3);
  busca.value = filtro.busca;

  // Tipo de preço de um modelo numa condição (mesma regra das etiquetas), guardado para não recalcular
  const memoPreco = new Map();
  function tipoPreco(m, cond) {
    const k = m.slug + '|' + cond;
    if (!memoPreco.has(k)) {
      const v = maisBarata(m, cond), an = v && analisar(v);
      memoPreco.set(k, !an ? null : an.dias < MIN_DIAS_ETIQUETA ? 'coletando' : an.classe);
    }
    return memoPreco.get(k);
  }
  const TIPOS_PRECO = [['', 'Todos'], ['barato', '↓ Abaixo do normal'], ['normal', 'Normal'], ['caro', '↑ Acima do normal']];

  // As contagens de cada filtro consideram os OUTROS filtros escolhidos.
  function passa(m, f) {
    const termos = f.busca.toLowerCase().split(/\s+/).filter(Boolean);
    return ofertasHoje(m, f.condicao).length && (!f.marca || m.linha === f.marca)
      && (!f.preco || tipoPreco(m, f.condicao) === f.preco)
      && (!f.linha || serieDe(m) === f.linha) && termos.every(x => m.modelo.toLowerCase().includes(x));
  }
  const contar = f => doCat.filter(m => passa(m, f)).length;
  function desenharFiltros() {
    segM.textContent = '';
    ['', ...cat.linhas].forEach(l => {
      const n = contar({...filtro, marca: l, linha: ''});
      const b = el('button', {type: 'button', 'aria-pressed': l === filtro.marca}, segM, l ? rot(l) : 'Todas');
      el('span', {class: 'n'}, b, n);
      if (!n && l !== filtro.marca) b.disabled = true;
      b.onclick = () => { filtro.marca = l; filtro.linha = ''; atualizar(); };
    });
    seg.textContent = '';
    let mostradas = 0;
    DADOS.condicoes.forEach(c => {
      const n = contar({...filtro, condicao: c});
      if (!n && c !== filtro.condicao) return;   // condição que não existe aqui: não aparece
      mostradas++;
      const b = el('button', {type: 'button', 'aria-pressed': c === filtro.condicao}, seg, rot(c));
      el('span', {class: 'n'}, b, n);
      b.onclick = () => { filtro.condicao = c; atualizar(); };
    });
    seg.parentElement.style.display = mostradas > 1 ? '' : 'none';   // só uma condição: esconde o filtro
    segP.textContent = '';
    let tipos = 0;
    TIPOS_PRECO.forEach(([k, texto]) => {
      const n = contar({...filtro, preco: k});
      if (k && !n && k !== filtro.preco) return;   // tipo de preço que não existe aqui: não aparece
      if (k) tipos++;
      const b = el('button', {type: 'button', 'aria-pressed': k === filtro.preco, class: k ? 'op-' + k : null}, segP, texto);
      el('span', {class: 'n'}, b, n);
      b.onclick = () => { filtro.preco = k; atualizar(); };
    });
    gP.style.display = tipos > 1 || filtro.preco ? '' : 'none';   // sem histórico ou tudo igual: esconde o filtro
    sel.textContent = '';
    el('option', {value: ''}, sel, 'Todas (' + contar({...filtro, linha: ''}) + ')');
    [...new Set(doCat.filter(m => !filtro.marca || m.linha === filtro.marca).map(serieDe))].forEach(l => {
      const n = contar({...filtro, linha: l});
      const o = el('option', {value: l}, sel, l + ' (' + n + ')');
      if (!n && l !== filtro.linha) o.disabled = true;
    });
    sel.value = filtro.linha;
  }
  sel.onchange = () => { filtro.linha = sel.value; atualizar(); };
  busca.oninput = () => { filtro.busca = busca.value; atualizar(); };

  const grade = el('div', {class: 'catalogo'}, ms);
  function atualizar() { desenharFiltros(); desenharGrade(); }
  function desenharGrade() {
    grade.textContent = '';
    const lista = doCat.filter(m => passa(m, filtro));
    if (!lista.length) { el('div', {class: 'vazio'}, grade, 'Nenhum modelo com esses filtros.'); return; }
    lista.forEach((m, i) => {
      const v = maisBarata(m, filtro.condicao);
      const melhor = v.hoje[0];
      const href = '#/modelo/' + m.slug + '?c=' + encodeURIComponent(filtro.condicao) + '&a=' + encodeURIComponent(v.armazenamento);
      const a = el('a', {class: 'produto card', href}, grade);
      const s = seloDaOferta(v);
      if (s) selo(a, s, i % 2 ? 8 : -9, true);
      const topo = el('div', {class: 'topo'}, a);
      const f = el('div', {class: 'foto'}, topo);
      if (m.foto) el('img', {src: m.foto, alt: '', loading: 'lazy'}, f);
      const info = el('div', null, topo);
      el('h3', null, info, m.modelo);
      const vars = ofertasHoje(m, filtro.condicao).map(x => rot(x.armazenamento));
      el('div', {class: 'arm'}, info, vars.join(vars.some(x => x.includes('·')) ? '  |  ' : ' · '));
      el('div', {class: 'apartir'}, a, 'A partir de');
      el('div', {class: 'preco-grande'}, a, preco(melhor.preco));
      a.classList.add('cartao-' + etiquetaPreco(el('div', {class: 'etiquetas'}, a), v));
      const lj = el('div', {class: 'loja'}, a);
      el('b', null, lj, melhor.loja); lj.append(' · ' + rot(v.armazenamento) + (melhor.loja === LOJA_SEM_IVA ? ' · exclusivo para estrangeiros' : ''));
      const b = el('span', {class: 'botao botao-azul'}, a, 'Ver histórico ');
      el('span', {class: 'seta', 'aria-hidden': 'true'}, b, '→');
    });
  }
  atualizar();
  onda(sec, 'var(--azul)');
}

// Cartão inclinado no topo: o maior desconto real de hoje (qualquer categoria).
// Sem histórico suficiente para isso, o iPhone novo mais barato.
function destaqueDoDia(pai) {
  let melhor = null, desconto = false;
  DADOS.modelos.forEach(m => {
    const v = maisBarata(m, 'Novo');
    if (!v) return;
    const an = analisar(v);
    if (an.dias >= MIN_DIAS_ETIQUETA && an.classe === 'barato' && (!melhor || !desconto || an.variacao < melhor.an.variacao)) {
      melhor = {m, v, an}; desconto = true;
    } else if (!desconto && m.linha === 'iPhone' && (!melhor || v.hoje[0].preco < melhor.v.hoje[0].preco)) {
      melhor = {m, v, an};
    }
  });
  if (!melhor) return;
  const {m, v, an} = melhor;
  const a = el('a', {class: 'destaque-dia', href: '#/modelo/' + m.slug + '?c=Novo&a=' + encodeURIComponent(v.armazenamento)}, pai);
  const c = el('div', {class: 'card'}, a);
  selo(a, desconto ? ['Desconto', 'real'] : ['Mais', 'barato'], -12);
  el('div', {class: 'rot'}, c, desconto ? 'Maior desconto de hoje' : 'iPhone novo mais barato hoje');
  if (m.foto) el('img', {src: m.foto, alt: ''}, c);
  el('div', {class: 'nome'}, c, m.modelo + ' ' + rot(v.armazenamento));
  el('div', {class: 'preco-grande'}, c, preco(v.hoje[0].preco));
  el('div', {class: 'rot', style: 'margin-top:6px'}, c, v.hoje[0].loja + (desconto ? ' · ' + pct(an.variacao) : ''));
  const b = el('span', {class: 'botao botao-azul'}, c, 'Ver histórico ');
  el('span', {class: 'seta', 'aria-hidden': 'true'}, b, '→');
}

// ============================================================
// PÁGINA 2 — detalhe do aparelho
// ============================================================
function paginaDetalhe(m, condPedida, armPedido, corPedida) {
  document.title = m.modelo + ' · Busca Fácil';
  const conds = DADOS.condicoes.filter(c => ofertasHoje(m, c).length);
  const cond = conds.includes(condPedida) ? condPedida : (conds[0] || DADOS.condicoes[0]);
  const vs = ofertasHoje(m, cond);
  const v0 = vs.find(x => x.armazenamento === armPedido) || vs[0];
  const cor = v0 && v0.cores.includes(corPedida) ? corPedida : '';
  const v = v0 && cor ? v0.porCor[cor] : v0;
  const link = (c, a, k) => '#/modelo/' + m.slug + '?c=' + encodeURIComponent(c) + (a ? '&a=' + a : '') + (k ? '&cor=' + encodeURIComponent(k) : '');

  const hero = el('section', {class: 'hero'}, app);
  estrelas(hero, [[84, 12, 28, 0], [70, 52, 16, .8], [94, 70, 20, 1.5], [55, 14, 12, 2.1]]);
  const mi = el('div', {class: 'miolo'}, hero);
  botao(mi, '← Todos os modelos', 'botao-contorno', null, '#/c/' + m.categoria).querySelector('.seta').remove();
  el('div', {class: 'espaco-voltar'}, mi);
  el('h1', {class: 'titulo-gigante menor'}, mi, m.modelo);
  el('div', {class: 'linha-sub'}, mi, [v0 && rot(v0.armazenamento), rot(cond), rot(cor) || 'todas as cores'].filter(Boolean).join(' · '));

  const barra = el('div', {class: 'filtros filtros-carrossel'}, mi);
  const g1 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g1, rot(m.rotuloVariante));
  const segA = el('div', {class: 'opcoes', role: 'group', 'aria-label': rot(m.rotuloVariante)}, g1);
  vs.forEach(x => { const b = el('button', {type: 'button', 'aria-pressed': x === v0}, segA, rot(x.armazenamento)); b.onclick = () => { location.hash = link(cond, encodeURIComponent(x.armazenamento), cor); }; });
  const g2 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g2, 'Condição');
  const segC = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Condição'}, g2);
  conds.forEach(c => {   // só as condições em que este produto existe hoje
    const b = el('button', {type: 'button', 'aria-pressed': c === cond}, segC, rot(c));
    b.onclick = () => { location.hash = link(c, v0 && encodeURIComponent(v0.armazenamento), cor); };
  });
  if (conds.length <= 1) g2.style.display = 'none';   // só uma condição: esconde o filtro
  if (v0 && v0.cores.some(k => k !== 'Cor não informada')) {   // sem nenhuma cor conhecida: esconde o filtro de cor
    const g3 = el('div', {class: 'grupo'}, barra);
    el('span', {class: 'rotulo'}, g3, 'Cor');
    const segK = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Cor'}, g3);
    ['', ...v0.cores].forEach(k => { const b = el('button', {type: 'button', 'aria-pressed': k === cor}, segK, rot(k) || 'Todas'); b.onclick = () => { location.hash = link(cond, encodeURIComponent(v0.armazenamento), k); }; });
  }
  // no carrossel, deixa o botão escolhido visível
  requestAnimationFrame(() => barra.querySelectorAll('.opcoes').forEach(o => {
    const b = o.querySelector('[aria-pressed="true"]');
    if (b && o.scrollWidth > o.clientWidth) o.scrollLeft = Math.max(0, b.offsetLeft - o.offsetLeft - 24);
  }));
  onda(hero, 'var(--azul-2)');
  if (!v) { el('div', {class: 'vazio miolo'}, app, 'Sem ofertas hoje.'); return; }

  const sec = el('section', {class: 'secao-cartoes pagina-detalhe'}, app);
  const ms = el('div', {class: 'miolo'}, sec);

  // ---- foto + lojas ----
  const g = el('div', {class: 'det-grade'}, ms);
  const ft = el('div', {class: 'card foto-card'}, g);
  if (m.foto) el('img', {src: m.foto, alt: m.modelo}, ft);
  if (m.foto && !m.fotoCorPrincipal && m.corPrincipal) el('div', {class: 'legenda-foto'}, ft, 'Foto em outra cor: ' + m.corPrincipal + ' não está à venda hoje.');

  const lc = el('div', {class: 'card lojas-card'}, g);
  selo(lc, ['Mais', 'barato'], 8);
  el('h2', null, lc, 'Onde comprar hoje');
  const alerta = alertaBlackFriday(v);
  if (alerta) {
    const al = el('div', {class: 'alerta'}, lc);
    el('b', null, al, 'Preço subiu antes da Black Friday');
    al.append('Hoje está ' + pct(alerta.subida) + ' acima da média de ' + dataLonga(alerta.de) + ' a ' + dataLonga(alerta.ate) +
      ' (' + preco(alerta.media) + '). Black Friday: ' + dataLonga(alerta.bf) + '.');
  }
  const ol = el('ol', {class: 'lista-lojas'}, lc);
  const melhor = v.hoje[0].preco;
  v.hoje.forEach((o, i) => {
    const li = el('li', {class: i === 0 ? 'primeiro' : null}, ol);
    el('span', {class: 'nome-loja'}, li, (i + 1) + 'º  ' + o.loja);
    el('span', {class: 'valor'}, li, preco(o.preco));
    const det = el('span', {class: 'detalhe', title: o.nome}, li);
    el('a', {href: o.link, target: '_blank', rel: 'noopener'}, det, 'Ver na loja →');
    det.append('  ' + o.nome);
    if (o.loja === LOJA_SEM_IVA) {
      const obs = el('span', {class: 'obs'}, li);
      el('b', null, obs, 'Preço exclusivo para estrangeiros');
      obs.append(' · sem IVA (10%). Com IVA: ' + preco(o.preco * 1.1));
    } else if (LOJAS_EM_DOLAR.includes(o.loja) && MOEDA === 'PYG') {
      el('span', {class: 'obs'}, li, 'Publicado em US$ ' + fmt(Math.round(o.preco / COTACAO * 100) / 100, 2) + ' · 1 US$ = ' + gs(COTACAO));
    } else if (!LOJAS_EM_DOLAR.includes(o.loja) && MOEDA === 'USD') {
      el('span', {class: 'obs'}, li, 'Publicado em ' + gs(o.preco) + ' · 1 US$ = ' + gs(COTACAO));
    }
  });
  v.semOfertaHoje.forEach(s => {
    const li = el('li', {class: 'fora'}, ol);
    el('span', {class: 'nome-loja'}, li, s.loja);
    el('span', {class: 'valor'}, li, '—');
    el('span', {class: 'detalhe'}, li, 'Sem oferta hoje · último preço em ' + dataLonga(s.desde));
  });

  // Celular: barra fixa com o menor preço, visível enquanto a pessoa troca os filtros.
  // Some quando a lista de lojas já está na tela.
  const bp = el('a', {class: 'barra-preco', href: '#/'}, app);
  const bpt = el('div', {class: 'bp-texto'}, bp);
  el('div', {class: 'bp-rot'}, bpt, 'Mais barato hoje');
  el('div', {class: 'bp-preco'}, bpt, preco(v.hoje[0].preco));
  el('div', {class: 'bp-loja'}, bpt, v.hoje[0].loja);
  const bpb = el('span', {class: 'botao botao-azul'}, bp, 'Ver lojas ');
  el('span', {class: 'seta', 'aria-hidden': 'true'}, bpb, '↓');
  bp.addEventListener('click', ev => {
    ev.preventDefault();
    if (!bp.classList.contains('passou')) lc.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
  // lista na tela: barra some · lista mais abaixo: preço + botão "Ver lojas ↓" · lista já passou: só o preço
  let agendado = false;
  function estadoBarra() {
    agendado = false;
    if (!document.body.contains(lc)) { window.removeEventListener('scroll', aoRolar); return; }
    const r = lc.getBoundingClientRect(), alt = window.innerHeight;
    const naTela = r.top < alt * 0.8 && r.bottom > alt * 0.2;
    bp.classList.toggle('oculta', naTela);
    bp.classList.toggle('passou', !naTela && r.bottom <= alt * 0.2);
  }
  function aoRolar() { if (!agendado) { agendado = true; requestAnimationFrame(estadoBarra); } }
  window.addEventListener('scroll', aoRolar, {passive: true});
  requestAnimationFrame(estadoBarra);

  // ---- indicador + gráfico ----
  const an = analisar(v);
  const g2b = el('div', {class: 'det-grade-2'}, ms);
  const ind = el('div', {class: 'card indicador'}, g2b);
  const sd = seloDaOferta(v);
  if (sd) selo(ind, sd, -8);
  el('h2', null, ind, 'O preço está bom?');
  el('div', {class: 'veredito'}, ind, VEREDITO[an.classe]);
  const vt = el('div', {class: 'var-texto'}, ind);
  el('b', null, vt, pct(an.variacao));
  vt.append(an.variacao <= 0 ? ' em relação à média dos últimos 40 dias' : ' acima da média dos últimos 40 dias');
  const regua = el('div', {class: 'regua', role: 'img', 'aria-label': 'Variação de ' + pct(an.variacao) + ' em relação à média'}, ind);
  el('span', {class: 'z-barato'}, regua); el('span', {class: 'z-normal'}, regua); el('span', {class: 'z-caro'}, regua);
  const pos = Math.max(0, Math.min(1, (an.variacao + 0.30) / 0.60)) * 100;
  el('span', {class: 'marcador', style: 'left:' + pos + '%'}, regua);
  el('span', {class: 'marcador-rot', style: 'left:' + pos + '%'}, regua, 'hoje');
  const rr = el('div', {class: 'regua-rot'}, ind);
  ['Barato', 'Normal', 'Caro'].forEach(x => el('span', null, rr, x));
  const dl = el('dl', {class: 'numeros'}, ind);
  el('dt', null, dl, 'Menor preço hoje'); el('dd', null, dl, preco(an.atual));
  el('dt', null, dl, 'Média dos últimos 40 dias'); el('dd', null, dl, preco(an.media));
  el('dt', null, dl, 'Dias com dados (de 40)'); el('dd', null, dl, String(an.dias));
  if (an.dias < MIN_DIAS_ETIQUETA) el('div', {class: 'nota'}, ind, 'Só ' + an.dias + (an.dias === 1 ? ' dia' : ' dias') + ' de histórico: o indicador fica confiável depois de algumas semanas.');
  el('div', {class: 'nota'}, ind, 'Barato: mais de 10% abaixo da média. Normal: até 10% para mais ou para menos. Caro: mais de 10% acima. A média considera o menor preço de cada dia nos últimos 40 dias.');

  const hc = el('div', {class: 'card'}, g2b);
  el('h2', null, hc, 'Menor preço de cada dia');
  graficoAno(hc, v, an);
  onda(sec, 'var(--azul)');
}

// ============================================================
// Gráfico de 12 meses: UMA linha = menor preço de cada dia
// ============================================================
function graficoAno(pai, v, an) {
  // no celular, o desenho tem proporção própria (senão o texto fica minúsculo)
  const estreito = window.innerWidth <= 760;
  const W = estreito ? 400 : 760, H = estreito ? 300 : 260, M = estreito ? {e: 44, d: 84, t: 10, b: 26} : {e: 52, d: 104, t: 10, b: 26};
  const iniJ = DADOS.inicioJanela, ult = DADOS.ultimaData;
  // Período adaptável: no máximo 12 meses; com menos histórico, começa no primeiro dia com preço.
  const pts = menorPorDia(v);
  let x0 = Math.max(t(iniJ), pts.length ? t(pts[0].data) : t(ult)) - DIA / 2, x1 = t(ult) + DIA / 2;
  if (x1 - x0 < 7 * DIA) { const falta = 7 * DIA - (x1 - x0); x0 -= falta / 2; x1 += falta / 2; }  // pelo menos 1 semana na tela
  const Xt = ms => M.e + (ms - x0) / (x1 - x0) * (W - M.e - M.d);
  const X = d => Xt(t(d));
  const valores = pts.map(p => conv(p.preco)).concat([conv(an.media12) * 0.9, conv(an.media12) * 1.1]);
  let ymin = Math.min(...valores), ymax = Math.max(...valores);
  const passos = MOEDA === 'USD' ? [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000] : [50e3, 100e3, 200e3, 250e3, 500e3, 1e6, 2e6, 2.5e6, 5e6, 1e7];
  const passo = passos.find(p => (ymax - ymin) / p <= 4) || passos[passos.length - 1];
  ymin = Math.floor((ymin - passo * 0.2) / passo) * passo;
  ymax = Math.ceil((ymax + passo * 0.2) / passo) * passo;
  const Y = p => M.t + (ymax - p) / (ymax - ymin) * (H - M.t - M.b);

  if (DADOS.simulado) el('div', {class: 'nota-sim'}, pai, 'Dados de teste: ' + dataLonga(DADOS.simulado.de) + ' a ' + dataLonga(DADOS.simulado.ate) + ' são inventados.');
  else if (an.primeiroDia > iniJ) el('div', {class: 'nota-sim'}, pai, 'A coleta começou em ' + dataLonga(an.primeiroDia) + '.');

  const caixa = el('div', {class: 'grafico'}, pai);
  const svg = el('svg:svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: 0,
    'aria-label': 'Menor preço de cada dia nos últimos 12 meses. Use as setas para percorrer os dias.'}, caixa);
  for (let p = ymin; p <= ymax; p += passo) {
    el('svg:line', {x1: M.e, x2: W - M.d, y1: Y(p), y2: Y(p), stroke: 'var(--linha-card)', 'stroke-width': 1}, svg);
    el('svg:text', {x: M.e - 10, y: Y(p) + 4, 'text-anchor': 'end'}, svg, MOEDA === 'USD' ? '$' + fmt(p) : milhoes(p));
  }
  // Marcas do eixo conforme o período: por mês, a cada poucos dias ou por dia
  const dias = (x1 - x0) / DIA, marcas = [];
  if (dias > 75) {
    const m = new Date(x0 + DIA / 2); m.setDate(1); m.setHours(12, 0, 0, 0);
    if (m.getTime() < x0) m.setMonth(m.getMonth() + 1);
    for (; m.getTime() <= x1; m.setMonth(m.getMonth() + 1)) marcas.push([m.getTime(), mesCurto(iso(m.getTime()))]);
  } else {
    const cada = dias > 35 ? 7 : dias > 14 ? 3 : 1;
    for (let ms = t(iso(x0 + DIA / 2)); ms <= x1; ms += cada * DIA) { const d = iso(ms); marcas.push([ms, d.slice(8, 10) + '/' + d.slice(5, 7)]); }
  }
  const pulo = Math.max(1, Math.ceil(marcas.length / (estreito ? 4 : 9)));
  marcas.forEach(([ms, txt], i) => {
    if (i % pulo === 0) el('svg:text', {x: Xt(ms), y: H - 6, 'text-anchor': dias > 75 ? 'start' : 'middle'}, svg, txt);
  });
  el('svg:rect', {x: M.e, width: W - M.e - M.d, y: Y(conv(an.media12) * 1.1), height: Y(conv(an.media12) * 0.9) - Y(conv(an.media12) * 1.1), fill: 'var(--azul-claro)'}, svg);
  el('svg:line', {x1: M.e, x2: W - M.d, y1: Y(conv(an.media12)), y2: Y(conv(an.media12)), stroke: 'var(--azul)', 'stroke-width': 1, 'stroke-opacity': 0.3}, svg);
  let caminho = '';
  pts.forEach((p, i) => {
    const continua = i > 0 && t(p.data) - t(pts[i - 1].data) === DIA;
    caminho += (continua ? 'L' : 'M') + Xt(t(p.data) - DIA / 2).toFixed(1) + ',' + Y(conv(p.preco)).toFixed(1) + 'L' + Xt(t(p.data) + DIA / 2).toFixed(1) + ',' + Y(conv(p.preco)).toFixed(1);
  });
  el('svg:path', {d: caminho, class: 'linha-preco', fill: 'none', 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}, svg);
  if (pts.length) {
    const u = pts[pts.length - 1];
    el('svg:circle', {cx: X(u.data), cy: Y(conv(u.preco)), r: 5, class: 'ponto-fim', 'stroke-width': 2}, svg);
    el('svg:text', {x: X(u.data) + 10, y: Y(conv(u.preco)) + 4, class: 'rot-fim'}, svg, preco(u.preco));
  }

  // interação "catraca"
  const cruz = el('svg:line', {y1: M.t, y2: H - M.b, class: 'cruz'}, svg);
  const marcador = el('svg:g', {class: 'marcador-dia'}, svg);
  const bolinha = el('svg:circle', {r: 7, 'stroke-width': 3}, marcador);
  const alvo = el('svg:rect', {x: M.e - 10, y: 0, width: W - M.e - M.d + 20, height: H, fill: 'transparent'}, svg);
  const dica = el('div', {class: 'dica'}, caixa);
  let atual = -1, porToque = false;  // porToque: o movimento atual é de um dedo (só aí vibra)
  function mostrar(idx) {
    if (!pts.length) return;
    idx = Math.max(0, Math.min(pts.length - 1, idx));
    const p = pts[idx];
    const mudou = idx !== atual; atual = idx;
    const x = X(p.data), y = Y(conv(p.preco));
    const primeiraVez = !svg.classList.contains('ativo');
    if (primeiraVez) svg.classList.add('sem-transicao');
    svg.classList.add('ativo');
    cruz.style.transform = 'translateX(' + x + 'px)';
    marcador.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    if (mudou) { bolinha.classList.remove('tic'); void bolinha.getBBox(); bolinha.classList.add('tic'); if (porToque) haptico(); }
    dica.textContent = '';
    el('div', {class: 'd'}, dica, new Date(p.data + 'T12:00:00').toLocaleDateString('pt-BR', {weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'}));
    el('div', {class: 'p'}, dica, preco(p.preco));
    el('div', {class: 'l'}, dica, p.loja + (p.loja === LOJA_SEM_IVA ? ' · exclusivo para estrangeiros' : ''));
    dica.style.display = 'block';
    const r = svg.getBoundingClientRect();
    const px = x * r.width / W, py = y * r.height / H;
    let esq = px + 14;
    if (esq + dica.offsetWidth > r.width) esq = px - 14 - dica.offsetWidth;
    dica.style.transform = 'translate(' + Math.max(0, esq) + 'px,' + Math.max(0, py - dica.offsetHeight - 10) + 'px)';
    if (primeiraVez) { void svg.getBoundingClientRect(); requestAnimationFrame(() => svg.classList.remove('sem-transicao')); }
  }
  function esconder() { svg.classList.remove('ativo'); dica.style.display = 'none'; atual = -1; }
  function peloPonteiro(ev) {
    porToque = ev.pointerType === 'touch' || ev.pointerType === 'pen';
    const r = svg.getBoundingClientRect();
    const ms = x0 + ((ev.clientX - r.left) * W / r.width - M.e) / (W - M.e - M.d) * (x1 - x0);
    let melhor = 0;
    pts.forEach((p, i) => { if (Math.abs(t(p.data) - ms) < Math.abs(t(pts[melhor].data) - ms)) melhor = i; });
    mostrar(melhor);
  }
  alvo.addEventListener('pointermove', peloPonteiro);
  alvo.addEventListener('pointerdown', peloPonteiro);
  alvo.addEventListener('pointerleave', esconder);
  svg.addEventListener('focus', () => { porToque = false; mostrar(atual < 0 ? pts.length - 1 : atual); });
  svg.addEventListener('blur', () => { if (!porToque) esconder(); });
  svg.addEventListener('keydown', ev => {
    porToque = false;
    if (ev.key === 'ArrowLeft') { mostrar(atual - 1); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight') { mostrar(atual + 1); ev.preventDefault(); }
    else if (ev.key === 'Escape') esconder();
  });

  const leg = el('div', {class: 'legenda'}, pai);
  const sm = el('span', null, leg); el('span', {class: 'chave-linha'}, sm); sm.append('Média 12 meses ' + preco(an.media12));
  const sf = el('span', null, leg); el('span', {class: 'chave-faixa'}, sf); sf.append('Faixa ±10% da média');
  const det = el('details', null, pai);
  el('summary', null, det, 'Ver tabela');
  const tab = el('table', null, det);
  const cab = el('tr', null, el('thead', null, tab));
  ['Mês', 'Menor preço', 'Dia', 'Loja'].forEach(h => el('th', null, cab, h));
  const corpo = el('tbody', null, tab);
  [...new Set(pts.map(p => p.data.slice(0, 7)))].reverse().forEach(mm => {
    const mn = pts.filter(p => p.data.startsWith(mm)).reduce((a, b) => b.preco < a.preco ? b : a);
    const tr = el('tr', null, corpo);
    el('td', null, tr, mesCurto(mm + '-01')); el('td', null, tr, preco(mn.preco)); el('td', null, tr, dataLonga(mn.data)); el('td', null, tr, mn.loja);
  });
}


// Resposta tátil (vibração curta) a cada dia, quando o dedo desliza sobre o gráfico.
// Android: API de vibração do navegador. iPhone (Safari não tem essa API): alternar um
// "interruptor" invisível faz o iOS 18+ dar o mesmo toque leve dos interruptores do sistema.
const haptico = (() => {
  if (typeof navigator.vibrate === 'function') return () => { try { navigator.vibrate(8); } catch (e) {} };
  const rotulo = document.createElement('label');
  const chave = document.createElement('input');
  chave.type = 'checkbox'; chave.setAttribute('switch', ''); chave.tabIndex = -1;
  rotulo.setAttribute('aria-hidden', 'true');
  rotulo.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
  rotulo.appendChild(chave);
  document.body.appendChild(rotulo);
  return () => rotulo.click();
})();

rota();
</script>
