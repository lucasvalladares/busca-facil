<style>
/* ============================================================
   CORES E MEDIDAS — ajuste aqui
   ============================================================ */
:root {
  --azul-escuro: #223488;   /* cabeçalho e títulos */
  --azul-medio:  #314595;   /* linhas do gráfico, bordas e hover */
  --laranja:     #EC9731;   /* SÓ destaques: selo "mais barato hoje", alerta Black Friday */
  --branco:      #FFFFFF;   /* fundo e cartões */

  /* apoio (neutros derivados do azul) */
  --texto:        #1C2240;  /* texto corrido */
  --texto-suave:  #5E647A;  /* textos secundários */
  --texto-fraco:  #6E7388;  /* eixos, legendas */
  --linha:        #E6E8F0;  /* bordas finas e grade */
  --tinta-azul:   #F3F5FB;  /* faixa do gráfico, fundos sutis */
  --texto-no-laranja: #1C2240;

  --raio: 8px;
  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* só quatro tamanhos de texto */
  --t-pequeno: 12px;
  --t-normal: 14px;
  --t-medio: 18px;
  --t-grande: 28px;
}
@font-face { font-family: "Inter"; src: url("fontes/inter-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--branco); color: var(--texto);
  font: 400 var(--t-normal)/1.5 var(--fonte); }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }

/* Cabeçalho */
header { border-bottom: 1px solid var(--linha); }
.cab { max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.marca { color: var(--azul-escuro); font-weight: 600; font-size: var(--t-medio); text-decoration: none; }
.cab .data { color: var(--texto-suave); font-size: var(--t-pequeno); }
.cab-dir { display: flex; align-items: center; gap: 16px; }
.moeda { display: inline-flex; border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
.moeda button { background: var(--branco); border: 0; padding: 4px 10px; cursor: pointer; font-size: var(--t-pequeno); color: var(--texto-suave); }
.moeda button + button { border-left: 1px solid var(--linha); }
.moeda button[aria-pressed="true"] { background: var(--azul-escuro); color: var(--branco); }
.aviso-teste { font-weight: 600; }
.cotacao { color: var(--texto-suave); font-size: var(--t-pequeno); margin: -24px 0 32px; }
main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { color: var(--azul-escuro); font-size: var(--t-grande); font-weight: 600; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
h2 { color: var(--azul-escuro); font-size: var(--t-medio); font-weight: 600; margin: 0; }
h3 { color: var(--azul-escuro); font-size: var(--t-normal); font-weight: 600; margin: 0 0 16px; }
.sub { color: var(--texto-suave); margin: 0 0 32px; }

/* Selos */
.selo { display: inline-block; font-size: var(--t-pequeno); font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: 4px; white-space: nowrap; }
.selo-destaque { background: var(--laranja); color: var(--texto-no-laranja); }

/* Filtros */
.filtros { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 32px; }
.grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
.grupo > .rotulo { color: var(--texto-suave); font-size: var(--t-pequeno); }
.opcoes { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.opcoes button { border: 1px solid var(--linha); background: var(--branco); border-radius: var(--raio); padding: 6px 12px; cursor: pointer; }
.opcoes button:hover:not(:disabled) { border-color: var(--azul-medio); }
.opcoes button[aria-pressed="true"] { background: var(--azul-escuro); border-color: var(--azul-escuro); color: var(--branco); }
.opcoes button:disabled { color: var(--texto-fraco); cursor: default; }
.opcoes .n { opacity: .7; }
.opcoes button.op-barato::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); margin-right: 6px; }
select, input[type=search] { border: 1px solid var(--linha); background: var(--branco); border-radius: var(--raio); padding: 6px 10px; }
select:hover, input[type=search]:hover, select:focus, input[type=search]:focus { border-color: var(--azul-medio); outline: none; }
input[type=search] { min-width: 200px; }
:focus-visible { outline: 2px solid var(--azul-medio); outline-offset: 2px; }

/* Página 1: catálogo */
.catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 24px; }
.produto { display: block; text-decoration: none; border: 1px solid var(--linha); border-radius: var(--raio); padding: 20px; transition: border-color .15s; }
.produto:hover { border-color: var(--azul-medio); }
.produto .topo { display: flex; gap: 16px; align-items: flex-start; }
.produto .foto { width: 72px; height: 72px; flex: none; display: flex; align-items: center; justify-content: center; }
.produto .foto img { max-width: 100%; max-height: 100%; object-fit: contain; }
.produto .info { min-width: 0; flex: 1; }
.produto .arm { color: var(--texto-fraco); font-size: var(--t-pequeno); margin-top: 2px; }
.produto .apartir { color: var(--texto-suave); font-size: var(--t-pequeno); margin-top: 16px; }
.produto .preco { color: var(--azul-escuro); font-size: var(--t-grande); font-weight: 600; line-height: 1.1; margin-top: 2px; }
.produto .loja { color: var(--texto-suave); font-size: var(--t-pequeno); margin-top: 4px; overflow-wrap: anywhere; }
.produto .selos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.vazio { color: var(--texto-suave); padding: 48px 0; }
.etiquetas { margin-top: 8px; }
.etiqueta { display: inline-flex; align-items: center; gap: 2px; border-radius: 4px; padding: 4px 8px; font-size: var(--t-pequeno); font-weight: 600; line-height: 1.2; }
.etiqueta-barato { background: var(--laranja); color: var(--texto-no-laranja); }
.etiqueta-normal { background: var(--tinta-azul); color: var(--azul-escuro); }
.etiqueta-caro { background: var(--azul-escuro); color: var(--branco); }
.etiquetas { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.etiqueta-pct { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .85; }
.mini-termo { position: relative; display: inline-flex; gap: 2px; width: 56px; height: 4px; flex: none; }
.mini-termo i { flex: 1; border-radius: 2px; background: var(--linha); }
.mini-termo i:nth-child(2) { background: var(--tinta-azul); }
.cartao-barato .mini-termo i:first-child { background: var(--laranja); }
.cartao-caro .mini-termo i:last-child { background: var(--azul-escuro); }
.mini-termo b { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--azul-escuro); box-shadow: 0 0 0 2px var(--branco); }
/* barato: o cartão inteiro em destaque */
.produto.cartao-barato { border-color: var(--laranja); box-shadow: inset 0 0 0 1px var(--laranja); }
/* caro: linha escura no topo do cartão */
.produto.cartao-caro { box-shadow: inset 0 3px 0 var(--azul-escuro); }
.etiqueta-coletando { background: var(--tinta-azul); color: var(--texto-suave); font-weight: 400; }

/* Página 2: detalhe */
.voltar { display: inline-block; color: var(--texto-suave); text-decoration: none; margin-bottom: 24px; }
.voltar:hover { color: var(--azul-medio); }
.destaque { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 48px; align-items: start; margin-bottom: 56px; }
.foto-grande { display: flex; flex-direction: column; align-items: center; }
.foto-grande img { width: 100%; max-width: 360px; max-height: 380px; object-fit: contain; }
.legenda-foto { color: var(--texto-fraco); font-size: var(--t-pequeno); margin-top: 8px; text-align: center; }
.lista-lojas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linha); }
.lista-lojas li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 16px 0; border-bottom: 1px solid var(--linha); }
.lista-lojas .nome-loja { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lista-lojas .valor { text-align: right; font-size: var(--t-medio); font-weight: 600; color: var(--azul-escuro); font-variant-numeric: tabular-nums; }
.lista-lojas li.primeiro .valor { font-size: var(--t-grande); }
.lista-lojas .detalhe { color: var(--texto-fraco); font-size: var(--t-pequeno); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista-lojas .detalhe a { color: var(--azul-medio); text-decoration: none; }
.lista-lojas .detalhe a:hover { text-decoration: underline; }
.lista-lojas .dif { text-align: right; color: var(--texto-fraco); font-size: var(--t-pequeno); font-variant-numeric: tabular-nums; }
.lista-lojas .obs { grid-column: 1 / -1; color: var(--texto-suave); font-size: var(--t-pequeno); }
.lista-lojas .obs b { color: var(--azul-escuro); font-weight: 600; }
.lista-lojas li.fora { color: var(--texto-fraco); }
.lista-lojas li.fora .valor { color: var(--texto-fraco); }
.alerta { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin: 0 0 24px; }
.alerta p { margin: 0; color: var(--texto-suave); }

.analise { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr); gap: 48px; border-top: 1px solid var(--linha); padding-top: 40px; }
.veredito { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.veredito .palavra { color: var(--azul-escuro); font-size: var(--t-grande); font-weight: 600; }
.var-texto { color: var(--texto-suave); margin-bottom: 24px; }
.var-texto b { color: var(--azul-escuro); font-weight: 600; }
.regua { position: relative; height: 6px; display: flex; gap: 2px; margin: 28px 0 8px; }
.regua span { flex: 1; border-radius: 3px; background: var(--linha); }
.regua span.z-normal { background: var(--tinta-azul); box-shadow: inset 0 0 0 1px var(--linha); }
.regua .marcador { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: var(--azul-escuro); box-shadow: 0 0 0 3px var(--branco); }
.regua .marcador-rot { position: absolute; bottom: 14px; transform: translateX(-50%); font-size: var(--t-pequeno); color: var(--azul-escuro); font-weight: 600; }
.regua-rot { display: flex; color: var(--texto-fraco); font-size: var(--t-pequeno); }
.regua-rot span { flex: 1; text-align: center; }
.numeros { margin: 24px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
.numeros dt { color: var(--texto-suave); }
.numeros dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--azul-escuro); }
.nota { color: var(--texto-fraco); font-size: var(--t-pequeno); margin-top: 16px; }
.nota-sim { color: var(--texto-suave); font-size: var(--t-pequeno); margin: -8px 0 16px; }

/* Gráfico */
.grafico { position: relative; }
.grafico svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.grafico text { font-size: 11px; fill: var(--texto-fraco); font-variant-numeric: tabular-nums; }
.grafico .rot-fim { fill: var(--azul-escuro); font-weight: 600; }
.linha-preco { stroke: var(--azul-medio); }
.ponto-fim { fill: var(--azul-medio); stroke: var(--branco); }
.grafico .cruz { stroke: var(--azul-medio); stroke-opacity: .35; stroke-width: 1; visibility: hidden; }
.marcador-dia { visibility: hidden; pointer-events: none; }
.marcador-dia circle { fill: var(--azul-medio); stroke: var(--branco); }
.grafico svg.ativo .cruz, .grafico svg.ativo .marcador-dia { visibility: visible; }
/* catraca: o marcador salta de um dia para o outro */
.grafico .cruz, .marcador-dia { transition: transform 110ms cubic-bezier(.3, 1.9, .55, 1); }
.marcador-dia circle.tic { animation: tic 160ms ease-out; }
@keyframes tic { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
.grafico svg.sem-transicao .cruz, .grafico svg.sem-transicao .marcador-dia, .grafico svg.sem-transicao ~ .dica { transition: none; }
.dica { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--branco); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: 8px 12px; font-size: var(--t-pequeno); white-space: nowrap; display: none; z-index: 2;
  transition: transform 110ms cubic-bezier(.3, 1.6, .55, 1); }
.dica .d { color: var(--texto-fraco); }
.dica .p { color: var(--azul-escuro); font-size: var(--t-medio); font-weight: 600; line-height: 1.3; }
.dica .l { color: var(--texto-suave); }
.legenda { display: flex; gap: 16px; flex-wrap: wrap; color: var(--texto-fraco); font-size: var(--t-pequeno); margin-top: 12px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.chave-linha { width: 14px; height: 0; border-top: 1px solid var(--azul-medio); opacity: .5; }
.chave-faixa { width: 14px; height: 10px; border-radius: 2px; background: var(--tinta-azul); box-shadow: inset 0 0 0 1px var(--linha); }
details { margin-top: 16px; font-size: var(--t-pequeno); }
summary { cursor: pointer; color: var(--texto-suave); }
summary:hover { color: var(--azul-medio); }
table { border-collapse: collapse; margin-top: 8px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--linha); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--texto-suave); font-weight: 600; }

/* Rodapé */
.status { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--linha); color: var(--texto-suave); font-size: var(--t-pequeno); }
.status ul { padding-left: 18px; margin: 8px 0; }
.status strong { color: var(--azul-escuro); font-weight: 600; }
.erro { color: var(--azul-escuro); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .grafico .cruz, .marcador-dia, .dica, .produto { transition: none; }
  .marcador-dia circle.tic { animation: none; }
}
/* Celular */
@media (max-width: 760px) {
  :root { --t-grande: 24px; }
  main { padding: 24px 16px 56px; }
  .cab { padding: 16px; }
  .catalogo { grid-template-columns: 1fr; gap: 16px; }
  .destaque, .analise { grid-template-columns: 1fr; gap: 32px; }
  .destaque { margin-bottom: 32px; }
  .foto-grande img { max-width: 220px; max-height: 240px; }
  .analise { padding-top: 32px; }
  .filtros { gap: 12px; }
  .grupo { width: 100%; }
  input[type=search] { min-width: 0; width: 100%; }
}
</style>
</head>

  const dia = {};

const JANELA_TERMOMETRO = 40;

  const todos = menorPorDia(v).filter(p => p.data <= DADOS.ultimaData);
  const media = l => l.reduce((s, p) => s + p.preco, 0) / l.length;
  const limite = iso(t(DADOS.ultimaData) - (JANELA_TERMOMETRO - 1) * DIA);

  return {atual, media: m40, media12: media(todos), variacao, classe, dias: pts.length,

// Black Friday = 4ª sexta-feira de novembro.
function blackFriday(ano) {
  const d = new Date(ano, 10, 1, 12);
  return new Date(ano, 10, 1 + (5 - d.getDay() + 7) % 7 + 21, 12);
}
// Alerta: nos 30 dias antes da Black Friday, o menor preço de hoje está mais de 5%
// acima da média do mês anterior a essa janela (o velho "sobe para depois dar desconto").
function alertaBlackFriday(v) {
  const hoje = t(DADOS.ultimaData);
  const bf = blackFriday(new Date(hoje).getFullYear()).getTime();
  if (hoje > bf || hoje < bf - 30 * DIA) return null;
  const ref = menorPorDia(v).filter(p => t(p.data) >= bf - 60 * DIA && t(p.data) < bf - 30 * DIA);
  if (ref.length < 7) return null;
  const media = ref.reduce((s, p) => s + p.preco, 0) / ref.length;
  const subida = (v.hoje[0].preco - media) / media;
  if (subida <= 0.05) return null;
  return {subida, media, de: ref[0].data, ate: ref[ref.length - 1].data, bf: iso(bf)};
}

      el('div', {class: 'arm'}, info, ofertasHoje(m, filtro.condicao).map(x => x.armazenamento).join(' · '));
      el('div', {class: 'apartir'}, a, 'A partir de');
      el('div', {class: 'preco'}, a, preco(melhor.preco));
      a.classList.add('cartao-' + etiquetaPreco(el('div', {class: 'etiquetas'}, a), v));
      el('div', {class: 'loja'}, a, melhor.loja + ' · ' + v.armazenamento + (melhor.loja === LOJA_SEM_IVA ? ' · preço exclusivo para estrangeiros' : ''));
      if (alertaBlackFriday(v)) {
        const s = el('div', {class: 'selos'}, a);
        el('span', {class: 'selo selo-destaque'}, s, 'Preço subiu antes da Black Friday');
      }
    });
  }
  atualizar();
  desenharStatus();
}

function desenharStatus() {
  const s = el('section', {class: 'status'}, app);
  el('strong', null, s, 'Lojas');
  const ul = el('ul', null, s);
  DADOS.status.forEach(st => {
    const li = el('li', null, ul);
    li.append(st.loja + ': ');
    if (st.status === 'ok') li.append(st.itens + ' iPhones em estoque');
    else el('span', {class: 'erro'}, li, 'erro na última coleta (' + st.data_hora.replace('T', ' ') + ')');
  });
  el('li', null, ul, 'Cellshop, Gonzalez Gimenez e Compumarket: não monitoradas.');
  el('p', null, s, 'Preços em guaranis (ou em dólares, se você escolher). Mega e Shopping China publicam em dólar: convertido pela cotação da coleta (1 US$ = ' +
    gs(COTACAO) + '). Nissei: preço exclusivo para estrangeiros (sem IVA). Shopping China: preço "tax free". ' +
    'Alemania Cell, Tecnostore e Visuar: valor original em guaranis (com IVA).');
  if (DADOS.simulado) el('p', null, s, 'Dados de teste: os preços de ' + dataLonga(DADOS.simulado.de) + ' a ' +
    dataLonga(DADOS.simulado.ate) + ' são inventados. Para apagar: python3 simular.py --apagar');
}

// ============================================================
// PÁGINA 2 — detalhe do produto
// ============================================================
function paginaDetalhe(m, condPedida, armPedido, corPedida) {
  document.title = m.modelo + ' · Busca Fácil';
  const conds = DADOS.condicoes.filter(c => ofertasHoje(m, c).length);
  const cond = conds.includes(condPedida) ? condPedida : (conds[0] || DADOS.condicoes[0]);
  const vs = ofertasHoje(m, cond);
  const v0 = vs.find(x => x.armazenamento === armPedido) || vs[0];
  // Cor escolhida: "" = todas as cores. Se a cor não existe nesta combinação, volta para "todas".
  const cor = v0 && v0.cores.includes(corPedida) ? corPedida : '';
  const v = v0 && cor ? v0.porCor[cor] : v0;   // a partir daqui, tudo usa os preços da cor escolhida
  const link = (c, a, k) => '#/modelo/' + m.slug + '?c=' + encodeURIComponent(c) + (a ? '&a=' + a : '') +
    (k ? '&cor=' + encodeURIComponent(k) : '');

  el('a', {class: 'voltar', href: '#/'}, app, '← Todos os modelos');
  el('h1', null, app, m.modelo + (v0 ? ' ' + v0.armazenamento : ''));
  el('p', {class: 'sub'}, app, cond + (cor ? ' · ' + cor : ' · todas as cores') + ' · preços de ' + dataLonga(DADOS.ultimaData));

  const barra = el('div', {class: 'filtros'}, app);
  const g1 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g1, 'Armazenamento');
  const segA = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Armazenamento'}, g1);
  vs.forEach(x => {
    const b = el('button', {type: 'button', 'aria-pressed': x === v0}, segA, x.armazenamento);
    b.onclick = () => { location.hash = link(cond, x.armazenamento, cor); };
  });
  const g2 = el('div', {class: 'grupo'}, barra);
  el('span', {class: 'rotulo'}, g2, 'Condição');
  const segC = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Condição'}, g2);
  conds.forEach(c => {   // só as condições em que este produto existe hoje
    const b = el('button', {type: 'button', 'aria-pressed': c === cond}, segC, c);
    b.onclick = () => { location.hash = link(c, v0 && v0.armazenamento, cor); };
  });
  if (conds.length <= 1) g2.style.display = 'none';   // só uma condição: esconde o filtro
  if (v0 && v0.cores.some(k => k !== 'Cor não informada')) {   // sem nenhuma cor conhecida: esconde o filtro de cor
    const g3 = el('div', {class: 'grupo'}, barra);
    el('span', {class: 'rotulo'}, g3, 'Cor');
    const segK = el('div', {class: 'opcoes', role: 'group', 'aria-label': 'Cor'}, g3);
    ['', ...v0.cores].forEach(k => {
      const b = el('button', {type: 'button', 'aria-pressed': k === cor}, segK, k || 'Todas');
      b.onclick = () => { location.hash = link(cond, v0.armazenamento, k); };
    });
  }
  if (!v) { el('div', {class: 'vazio'}, app, 'Sem ofertas hoje.'); return; }

  // ---- foto à esquerda, lojas à direita ----
  const topo = el('div', {class: 'destaque'}, app);
  const ft = el('div', {class: 'foto-grande'}, topo);
  if (m.foto) el('img', {src: m.foto, alt: m.modelo}, ft);
  if (m.foto && !m.fotoCorPrincipal && m.corPrincipal)
    el('div', {class: 'legenda-foto'}, ft, 'Foto em outra cor: ' + m.corPrincipal + ' não está à venda hoje.');

  const of = el('div', null, topo);
  const alerta = alertaBlackFriday(v);
  if (alerta) {
    const al = el('div', {class: 'alerta'}, of);
    el('span', {class: 'selo selo-destaque'}, al, 'Preço subiu antes da Black Friday');
    el('p', null, al, 'Hoje está ' + pct(alerta.subida) + ' acima da média de ' + dataLonga(alerta.de) + ' a ' +
      dataLonga(alerta.ate) + ' (' + preco(alerta.media) + '). Black Friday: ' + dataLonga(alerta.bf) + '.');
  }
  el('h3', null, of, 'Lojas, da mais barata para a mais cara');
  const ol = el('ol', {class: 'lista-lojas'}, of);
  const melhor = v.hoje[0].preco;
  v.hoje.forEach((o, i) => {
    const li = el('li', {class: i === 0 ? 'primeiro' : null}, ol);
    const nm = el('span', {class: 'nome-loja'}, li, o.loja);
    if (i === 0) el('span', {class: 'selo selo-destaque'}, nm, 'Mais barato hoje');
    el('span', {class: 'valor'}, li, preco(o.preco));
    const det = el('span', {class: 'detalhe', title: o.nome}, li);
    el('a', {href: o.link, target: '_blank', rel: 'noopener'}, det, 'Ver na loja ↗');
    det.append('  ' + o.nome);
    el('span', {class: 'dif'}, li, i === 0 ? '' : '+' + preco(o.preco - melhor) + ' (' + pct((o.preco - melhor) / melhor) + ')');
    if (o.loja === LOJA_SEM_IVA) {
      const obs = el('span', {class: 'obs'}, li);
      el('b', null, obs, 'Preço exclusivo para estrangeiros');
      obs.append(' · sem IVA (10%). Com IVA: ' + preco(o.preco * 1.1));
    } else if (LOJAS_EM_DOLAR.includes(o.loja) && MOEDA === 'PYG') {
      el('span', {class: 'obs'}, li, 'Publicado em US$ ' + fmt(Math.round(o.preco / COTACAO * 100) / 100, 2) + ' · 1 US$ = ' + gs(COTACAO));
    } else if (!LOJAS_EM_DOLAR.includes(o.loja) && MOEDA === 'USD') {
      el('span', {class: 'obs'}, li, 'Publicado em ' + gs(o.preco) + ' · 1 US$ = ' + gs(COTACAO));
    }
  });
  v.semOfertaHoje.forEach(s => {
    const li = el('li', {class: 'fora'}, ol);
    el('span', {class: 'nome-loja'}, li, s.loja);
    el('span', {class: 'valor'}, li, '—');
    el('span', {class: 'detalhe'}, li, 'Sem oferta hoje · último preço em ' + dataLonga(s.desde));
  });

  // ---- indicador à esquerda, gráfico à direita ----
  const an = analisar(v);
  const baixo = el('div', {class: 'analise'}, app);
  const ind = el('div', null, baixo);
  el('h3', null, ind, 'O preço de hoje está bom?');
  const ver = el('div', {class: 'veredito'}, ind);
  el('span', {class: 'palavra'}, ver, VEREDITO[an.classe]);
  if (an.classe === 'barato') el('span', {class: 'selo selo-destaque'}, ver, 'Boa hora para comprar');
  const vt = el('div', {class: 'var-texto'}, ind);
  el('b', null, vt, pct(an.variacao));
  vt.append(an.variacao <= 0 ? ' em relação à média dos últimos 40 dias' : ' acima da média dos últimos 40 dias');
  const regua = el('div', {class: 'regua', role: 'img', 'aria-label': 'Variação de ' + pct(an.variacao) + ' em relação à média'}, ind);
  el('span', {class: 'z-barato'}, regua); el('span', {class: 'z-normal'}, regua); el('span', {class: 'z-caro'}, regua);
  const pos = Math.max(0, Math.min(1, (an.variacao + 0.30) / 0.60)) * 100;
  el('span', {class: 'marcador', style: 'left:' + pos + '%'}, regua);
  el('span', {class: 'marcador-rot', style: 'left:' + pos + '%'}, regua, 'hoje');
  const rr = el('div', {class: 'regua-rot'}, ind);
  ['Barato', 'Normal', 'Caro'].forEach(x => el('span', null, rr, x));
  const dl = el('dl', {class: 'numeros'}, ind);
  el('dt', null, dl, 'Menor preço hoje'); el('dd', null, dl, preco(an.atual));
  el('dt', null, dl, 'Média dos últimos 40 dias'); el('dd', null, dl, preco(an.media));
  el('dt', null, dl, 'Dias com dados (de 40)'); el('dd', null, dl, String(an.dias));
  if (an.dias < MIN_DIAS_ETIQUETA) el('div', {class: 'nota'}, ind, 'Só ' + an.dias + (an.dias === 1 ? ' dia' : ' dias') +
    ' de histórico. O indicador fica confiável depois de algumas semanas de coleta.');
  el('div', {class: 'nota'}, ind, 'Barato: mais de 10% abaixo da média. Normal: até 10% para mais ou para menos. ' +
    'Caro: mais de 10% acima. A média usa o menor preço de cada dia entre todas as lojas, nos últimos 40 dias.');

  const hist = el('div', null, baixo);
  el('h3', null, hist, 'Menor preço de cada dia, últimos 12 meses');
  graficoAno(hist, v, an);
}

// ============================================================
// Gráfico de 12 meses: UMA linha = menor preço de cada dia
// ============================================================
function graficoAno(pai, v, an) {
  // no celular, o desenho tem proporção própria (senão o texto fica minúsculo)
  const estreito = window.innerWidth <= 760;
  const W = estreito ? 400 : 760, H = estreito ? 300 : 260, M = estreito ? {e: 44, d: 84, t: 10, b: 26} : {e: 52, d: 104, t: 10, b: 26};
  const iniJ = DADOS.inicioJanela, ult = DADOS.ultimaData;
  // Período adaptável: no máximo 12 meses; com menos histórico, começa no primeiro dia com preço.
  const pts = menorPorDia(v);
  let x0 = Math.max(t(iniJ), pts.length ? t(pts[0].data) : t(ult)) - DIA / 2, x1 = t(ult) + DIA / 2;
  if (x1 - x0 < 7 * DIA) { const falta = 7 * DIA - (x1 - x0); x0 -= falta / 2; x1 += falta / 2; }  // pelo menos 1 semana na tela
  const Xt = ms => M.e + (ms - x0) / (x1 - x0) * (W - M.e - M.d);
  const X = d => Xt(t(d));

  const valores = pts.map(p => conv(p.preco)).concat([conv(an.media12) * 0.9, conv(an.media12) * 1.1]);
  let ymin = Math.min(...valores), ymax = Math.max(...valores);
  const passos = MOEDA === 'USD' ? [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000] : [50e3, 100e3, 200e3, 250e3, 500e3, 1e6, 2e6, 2.5e6, 5e6, 1e7];
  const passo = passos.find(p => (ymax - ymin) / p <= 4) || passos[passos.length - 1];
  ymin = Math.floor((ymin - passo * 0.2) / passo) * passo;
  ymax = Math.ceil((ymax + passo * 0.2) / passo) * passo;
  const Y = p => M.t + (ymax - p) / (ymax - ymin) * (H - M.t - M.b);

  if (DADOS.simulado) el('div', {class: 'nota-sim'}, pai,
    'Dados de teste: ' + dataLonga(DADOS.simulado.de) + ' a ' + dataLonga(DADOS.simulado.ate) + ' são inventados.');
  else if (an.primeiroDia > iniJ) el('div', {class: 'nota-sim'}, pai, 'A coleta começou em ' + dataLonga(an.primeiroDia) + '.');

  const caixa = el('div', {class: 'grafico'}, pai);
  const svg = el('svg:svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: 0,
    'aria-label': 'Menor preço de cada dia nos últimos 12 meses. Use as setas para percorrer os dias.'}, caixa);

  // grade leve: só linhas horizontais, bem claras
  for (let p = ymin; p <= ymax; p += passo) {
    el('svg:line', {x1: M.e, x2: W - M.d, y1: Y(p), y2: Y(p), stroke: 'var(--linha)', 'stroke-width': 1}, svg);
    el('svg:text', {x: M.e - 10, y: Y(p) + 4, 'text-anchor': 'end'}, svg, MOEDA === 'USD' ? '$' + fmt(p) : milhoes(p));
  }
  // Marcas do eixo conforme o período: por mês, a cada poucos dias ou por dia
  const dias = (x1 - x0) / DIA, marcas = [];
  if (dias > 75) {
    const m = new Date(x0 + DIA / 2); m.setDate(1); m.setHours(12, 0, 0, 0);
    if (m.getTime() < x0) m.setMonth(m.getMonth() + 1);
    for (; m.getTime() <= x1; m.setMonth(m.getMonth() + 1)) marcas.push([m.getTime(), mesCurto(iso(m.getTime()))]);
  } else {
    const cada = dias > 35 ? 7 : dias > 14 ? 3 : 1;
    for (let ms = t(iso(x0 + DIA / 2)); ms <= x1; ms += cada * DIA) { const d = iso(ms); marcas.push([ms, d.slice(8, 10) + '/' + d.slice(5, 7)]); }
  }
  const pulo = Math.max(1, Math.ceil(marcas.length / (estreito ? 4 : 9)));
  marcas.forEach(([ms, txt], i) => {
    if (i % pulo === 0) el('svg:text', {x: Xt(ms), y: H - 6, 'text-anchor': dias > 75 ? 'start' : 'middle'}, svg, txt);
  });

  // faixa normal (média ±10%) e linha da média
  el('svg:rect', {x: M.e, width: W - M.e - M.d, y: Y(conv(an.media12) * 1.1), height: Y(conv(an.media12) * 0.9) - Y(conv(an.media12) * 1.1), fill: 'var(--tinta-azul)'}, svg);
  el('svg:line', {x1: M.e, x2: W - M.d, y1: Y(conv(an.media12)), y2: Y(conv(an.media12)), stroke: 'var(--azul-medio)', 'stroke-width': 1, 'stroke-opacity': 0.35}, svg);

  // linha em degraus (o preço vale o dia inteiro)
  let caminho = '';
  pts.forEach((p, i) => {
    const continua = i > 0 && t(p.data) - t(pts[i - 1].data) === DIA;
    caminho += (continua ? 'L' : 'M') + Xt(t(p.data) - DIA / 2).toFixed(1) + ',' + Y(conv(p.preco)).toFixed(1) +
               'L' + Xt(t(p.data) + DIA / 2).toFixed(1) + ',' + Y(conv(p.preco)).toFixed(1);
  });
  el('svg:path', {d: caminho, class: 'linha-preco', fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}, svg);
  if (pts.length) {
    const u = pts[pts.length - 1];
    el('svg:circle', {cx: X(u.data), cy: Y(conv(u.preco)), r: 4, class: 'ponto-fim', 'stroke-width': 2}, svg);
    el('svg:text', {x: X(u.data) + 9, y: Y(conv(u.preco)) + 4, class: 'rot-fim'}, svg, preco(u.preco));
  }

  // interação "catraca": o marcador anda de dia em dia, com um pequeno salto
  const cruz = el('svg:line', {y1: M.t, y2: H - M.b, class: 'cruz'}, svg);
  const marcador = el('svg:g', {class: 'marcador-dia'}, svg);
  const bolinha = el('svg:circle', {r: 6, 'stroke-width': 3}, marcador);
  const alvo = el('svg:rect', {x: M.e - 10, y: 0, width: W - M.e - M.d + 20, height: H, fill: 'transparent'}, svg);
  const dica = el('div', {class: 'dica'}, caixa);
  let atual = -1, porToque = false;  // porToque: o movimento atual é de um dedo (só aí vibra)
  function mostrar(idx) {
    if (!pts.length) return;
    idx = Math.max(0, Math.min(pts.length - 1, idx));
    const p = pts[idx];
    const mudou = idx !== atual; atual = idx;
    const x = X(p.data), y = Y(conv(p.preco));
    const primeiraVez = !svg.classList.contains('ativo');
    if (primeiraVez) svg.classList.add('sem-transicao');
    svg.classList.add('ativo');
    cruz.style.transform = 'translateX(' + x + 'px)';
    marcador.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    if (mudou) { bolinha.classList.remove('tic'); void bolinha.getBBox(); bolinha.classList.add('tic'); if (porToque) haptico(); }
    dica.textContent = '';
    el('div', {class: 'd'}, dica, new Date(p.data + 'T12:00:00').toLocaleDateString('pt-BR', {weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'}));
    el('div', {class: 'p'}, dica, preco(p.preco));
    el('div', {class: 'l'}, dica, p.loja + (p.loja === LOJA_SEM_IVA ? ' · exclusivo para estrangeiros' : ''));
    dica.style.display = 'block';
    const r = svg.getBoundingClientRect();
    const px = x * r.width / W, py = y * r.height / H;
    let esq = px + 14;
    if (esq + dica.offsetWidth > r.width) esq = px - 14 - dica.offsetWidth;
    dica.style.transform = 'translate(' + Math.max(0, esq) + 'px,' + Math.max(0, py - dica.offsetHeight - 10) + 'px)';
    if (primeiraVez) { void svg.getBoundingClientRect(); requestAnimationFrame(() => svg.classList.remove('sem-transicao')); }
  }
  function esconder() { svg.classList.remove('ativo'); dica.style.display = 'none'; atual = -1; }
  function peloPonteiro(ev) {
    porToque = ev.pointerType === 'touch' || ev.pointerType === 'pen';
    const r = svg.getBoundingClientRect();
    const ms = x0 + ((ev.clientX - r.left) * W / r.width - M.e) / (W - M.e - M.d) * (x1 - x0);
    let melhor = 0;
    pts.forEach((p, i) => { if (Math.abs(t(p.data) - ms) < Math.abs(t(pts[melhor].data) - ms)) melhor = i; });
    mostrar(melhor);
  }
  alvo.addEventListener('pointermove', peloPonteiro);
  alvo.addEventListener('pointerdown', peloPonteiro);
  alvo.addEventListener('pointerleave', esconder);
  svg.addEventListener('focus', () => { porToque = false; mostrar(atual < 0 ? pts.length - 1 : atual); });
  svg.addEventListener('blur', () => { if (!porToque) esconder(); });
  svg.addEventListener('keydown', ev => {
    porToque = false;
    if (ev.key === 'ArrowLeft') { mostrar(atual - 1); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight') { mostrar(atual + 1); ev.preventDefault(); }
    else if (ev.key === 'Escape') esconder();
  });

  const leg = el('div', {class: 'legenda'}, pai);
  const sm = el('span', null, leg); el('span', {class: 'chave-linha'}, sm); sm.append('Média 12 meses ' + preco(an.media12));
  const sf = el('span', null, leg); el('span', {class: 'chave-faixa'}, sf); sf.append('Faixa ±10% da média');

  const det = el('details', null, pai);
  el('summary', null, det, 'Ver tabela');
  const tab = el('table', null, det);
  const cab = el('tr', null, el('thead', null, tab));
  ['Mês', 'Menor preço', 'Dia', 'Loja'].forEach(h => el('th', null, cab, h));
  const corpo = el('tbody', null, tab);
  [...new Set(pts.map(p => p.data.slice(0, 7)))].reverse().forEach(mm => {
    const mn = pts.filter(p => p.data.startsWith(mm)).reduce((a, b) => b.preco < a.preco ? b : a);
    const tr = el('tr', null, corpo);
    el('td', null, tr, mesCurto(mm + '-01')); el('td', null, tr, preco(mn.preco));
    el('td', null, tr, dataLonga(mn.data)); el('td', null, tr, mn.loja);
  });
}


// Resposta tátil (vibração curta) a cada dia, quando o dedo desliza sobre o gráfico.
// Android: API de vibração do navegador. iPhone (Safari não tem essa API): alternar um
// "interruptor" invisível faz o iOS 18+ dar o mesmo toque leve dos interruptores do sistema.
const haptico = (() => {
  if (typeof navigator.vibrate === 'function') return () => { try { navigator.vibrate(8); } catch (e) {} };
  const rotulo = document.createElement('label');
  const chave = document.createElement('input');
  chave.type = 'checkbox'; chave.setAttribute('switch', ''); chave.tabIndex = -1;
  rotulo.setAttribute('aria-hidden', 'true');
  rotulo.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
  rotulo.appendChild(chave);
  document.body.appendChild(rotulo);
  return () => rotulo.click();
})();

rota();
